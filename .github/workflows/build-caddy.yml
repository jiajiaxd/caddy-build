name: Build Caddy and publish to GHCR

on:
  workflow_dispatch:
  schedule:
    # 04:00 Asia/Shanghai
    - cron: "0 20 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        run: |
          IMAGE_NAME="${REGISTRY}/${GITHUB_REPOSITORY}"
          echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check latest Caddy and plugin versions
        id: update_check
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="${{ steps.image.outputs.name }}:latest"
          CHECK_DIR="/tmp/caddy-check"

          mkdir -p "$CHECK_DIR"

          mapfile -t PLUGINS < <(
            awk '
              /--with([=[:space:]]|$)/ {
                for (i = 1; i <= NF; i++) {
                  if ($i == "--with" && (i + 1) <= NF) {
                    print $(i + 1)
                  } else if ($i ~ /^--with=/) {
                    sub(/^--with=/, "", $i)
                    print $i
                  }
                }
              }
            ' Dockerfile | sed 's/\\$//' | sed '/^$/d'
          )

          QUERY_MODULES=("github.com/caddyserver/caddy/v2@latest")
          for plugin in "${PLUGINS[@]}"; do
            if [[ "$plugin" == *@* ]]; then
              QUERY_MODULES+=("$plugin")
            else
              QUERY_MODULES+=("${plugin}@latest")
            fi
          done

          docker pull caddy:builder

          docker run --rm caddy:builder \
            go list -m -f '{{.Path}} {{.Version}}' "${QUERY_MODULES[@]}" \
            | sort -u > "$CHECK_DIR/latest.txt"

          echo "Latest requested modules:"
          cat "$CHECK_DIR/latest.txt"

          if docker pull "$IMAGE"; then
            OLD_CONTAINER="$(docker create "$IMAGE")"
            docker cp "$OLD_CONTAINER:/usr/bin/caddy" "$CHECK_DIR/caddy-old"
            docker rm "$OLD_CONTAINER"

            docker run --rm -v "$CHECK_DIR:/work" caddy:builder \
              go version -m /work/caddy-old > "$CHECK_DIR/old-all.txt"

            : > "$CHECK_DIR/current.txt"
            while read -r path version; do
              awk -v path="$path" '
                ($1 == "mod" || $1 == "dep") && $2 == path {
                  print $2, $3
                }
              ' "$CHECK_DIR/old-all.txt" >> "$CHECK_DIR/current.txt"
            done < "$CHECK_DIR/latest.txt"

            sort -u -o "$CHECK_DIR/current.txt" "$CHECK_DIR/current.txt"

            echo "Current published modules:"
            cat "$CHECK_DIR/current.txt"

            if cmp -s "$CHECK_DIR/current.txt" "$CHECK_DIR/latest.txt"; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Current GHCR image already contains the latest requested Caddy/plugin versions."
            else
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Caddy/plugin update found:"
              diff -u "$CHECK_DIR/current.txt" "$CHECK_DIR/latest.txt" || true
            fi
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No existing GHCR image found, will publish first image."
          fi

      - name: Set up QEMU
        if: github.event_name != 'pull_request' && steps.update_check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: github.event_name != 'pull_request' && steps.update_check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        if: github.event_name != 'pull_request' && steps.update_check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Skip publish
        if: steps.update_check.outputs.should_build == 'false'
        run: |
          echo "Current GHCR image already contains the latest requested Caddy/plugin versions. Skip publishing."
